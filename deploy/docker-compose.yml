name: coredrive

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-coredrive}
      POSTGRES_USER: ${POSTGRES_USER:-coredrive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - coredrive-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-coredrive} -d ${POSTGRES_DB:-coredrive}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    env_file: .env
    environment:
      PORT: 3000
      HOST: 0.0.0.0
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "3000"

  publisher:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "apps/publisher/dist/main.js"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  ingest:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    command: ["node", "apps/ingest/dist/main.js"]
    env_file: .env
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3011:80"
    depends_on:
      - api

volumes:
  coredrive-db:
