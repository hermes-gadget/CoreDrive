services:
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  publisher:
    environment:
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: staging
      MQTT_PASSWORD: staging
    depends_on:
      mqtt:
        condition: service_started

  ingest:
    environment:
      MQTT_URL: mqtt://mqtt:1883
      MQTT_USERNAME: staging
      MQTT_PASSWORD: staging
    depends_on:
      mqtt:
        condition: service_started
