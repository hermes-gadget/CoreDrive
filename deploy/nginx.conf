upstream coredrive_api {
    server api:3000;
}

proxy_cache_path /var/cache/nginx/tiles levels=1:2 keys_zone=tiles:20m max_size=256m inactive=30d use_temp_path=off;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The only ingress is cloudflared. Docker publishes the port through the
    # bridge gateway, so trust the private container networks and loopback.
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 172.16.0.0/12;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(self), bluetooth=(self), camera=(), microphone=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Cloudflare terminates TLS. Redirect cleartext requests at the origin too,
    # so a misconfigured edge rule cannot serve the app over HTTP.
    if ($http_x_forwarded_proto = "http") {
        return 301 https://$host$request_uri;
    }

    location = /healthz {
        default_type text/plain;
        access_log off;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://coredrive_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 30s;
    }

    location = /readyz {
        proxy_pass http://coredrive_api/readyz;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }

    location = /metrics {
        proxy_pass http://coredrive_api/metrics;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
    }

    location /assets/ {
        try_files $uri =404;
    }

    location /tiles/osm/ {
        proxy_pass https://tile.openstreetmap.org/;
        proxy_http_version 1.1;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header User-Agent "CoreDrive/0.1 (+https://wardrive.nemesh.uk)";
        proxy_set_header Referer "https://wardrive.nemesh.uk/";
        proxy_cache tiles;
        proxy_cache_valid 200 30d;
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
        add_header X-Cache-Status $upstream_cache_status;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
